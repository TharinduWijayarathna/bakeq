<!DOCTYPE html>
<html>
<head>
    <title>Admin - Pos - Wireframe</title>
    
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; background: #eaebec; margin: 0; padding: 20px; }
    .wf-container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #ccc; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .wf-header { border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .wf-logo { font-size: 24px; font-weight: bold; }
    .wf-nav a { margin-left: 15px; text-decoration: none; color: #555; }
    .wf-box { border: 2px dashed #aaa; padding: 20px; margin: 15px 0; background: #f9f9f9; text-align: center; color: #666; }
    .wf-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
    .wf-col { flex: 1; min-width: 250px; }
    .wf-button { background: #444; color: white; padding: 10px 20px; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
    .wf-button { background: #666666; }
    .wf-img { background: #e0e0e0; height: 200px; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; color: #888; }
    .wf-sidebar { width: 250px; border-right: 1px solid #ccc; padding-right: 20px; }
    .wf-main { flex: 1; padding-left: 20px; }
    .wf-footer { border-top: 1px solid #ccc; margin-top: 30px; padding-top: 15px; text-align: center; font-size: 14px; color: #777; }
    .wf-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .wf-table th, .wf-table td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    .wf-table th { background: #eee; }
</style>

</head>
<body>
    <div class="wf-container">
        
        <div class="wf-header" style="background: #333333; color: white; padding: 15px; margin: -20px -20px 20px -20px;">
            <div class="wf-logo">[ POS LOGO ]</div>
            <div class="wf-nav">
                <span style="color: white; margin-right: 20px;">Staff: Jane Doe</span>
                <a href="dashboard.html" style="color: #ccc;">Back to Admin</a>
            </div>
        </div>
        
        <div class="wf-row">
            <div class="wf-col" style="flex: 2;">
                <input type="text" placeholder="Search products or scan barcode..." style="width: 100%; padding: 10px; margin-bottom: 20px;">
                <div class="wf-row">
                    <div class="wf-col wf-box" style="padding: 10px; cursor: pointer;">
                        <div class="wf-img" style="height: 100px;">Img</div>
                        <p style="margin: 5px 0;">Vanilla Cupcake<br><strong>$5.00</strong></p>
                    </div>
                    <div class="wf-col wf-box" style="padding: 10px; cursor: pointer;">
                        <div class="wf-img" style="height: 100px;">Img</div>
                        <p style="margin: 5px 0;">Red Velvet Slice<br><strong>$8.00</strong></p>
                    </div>
                    <div class="wf-col wf-box" style="padding: 10px; cursor: pointer;">
                        <div class="wf-img" style="height: 100px;">Img</div>
                        <p style="margin: 5px 0;">Choc Truffle (1kg)<br><strong>$35.00</strong></p>
                    </div>
                </div>
                <div class="wf-row">
                    <div class="wf-col wf-box" style="padding: 10px; cursor: pointer;">
                        <div class="wf-img" style="height: 100px;">Img</div>
                        <p style="margin: 5px 0;">Custom Cake Deposit<br><strong>$50.00</strong></p>
                    </div>
                    <div class="wf-col wf-box" style="padding: 10px; cursor: pointer; visibility: hidden;"></div>
                    <div class="wf-col wf-box" style="padding: 10px; cursor: pointer; visibility: hidden;"></div>
                </div>
            </div>
            <div class="wf-col" style="flex: 1; border-left: 1px solid #ccc; padding-left: 20px;">
                <h3>Current Order</h3>
                <table class="wf-table">
                    <tr>
                        <td>1x Vanilla Cupcake</td>
                        <td style="text-align: right;">$5.00</td>
                    </tr>
                    <tr>
                        <td>1x Choc Truffle (1kg)</td>
                        <td style="text-align: right;">$35.00</td>
                    </tr>
                </table>
                <hr style="margin: 20px 0;">
                <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: bold;">
                    <span>Total:</span>
                    <span>$40.00</span>
                </div>
                <br>
                <button class="wf-button wf-button" style="width: 100%; padding: 15px; font-size: 18px;">Charge $40.00</button>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="wf-button" style="flex: 1; background: #666666;">Cash</button>
                    <button class="wf-button" style="flex: 1; background: #666666;">Card</button>
                </div>
            </div>
        </div>
    
    </div>
</body>
</html>
